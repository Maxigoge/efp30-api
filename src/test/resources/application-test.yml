spring:
  datasource:
    url: jdbc:h2:mem:efp30;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  session:
    jdbc:
      initialize-schema: always
management:
  health:
    db:
      enabled: true
