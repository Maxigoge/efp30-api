spring:
  application:
    name: efp30-api
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/efp30?connectionTimeZone=%2B00%3A00&forceConnectionTimeZoneToSession=true&preserveInstants=true}
    username: ${DATABASE_USERNAME:efp30}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: America/Argentina/Buenos_Aires
    deserialization:
      fail-on-unknown-properties: true
efp30:
  media:
    root: ${MEDIA_ROOT:./data/media}
server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${TRUSTED_PROXY_PATTERN:^172\\.30\\.33\\.2$}"
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      host-header: X-Forwarded-Host
      port-header: X-Forwarded-Port
  servlet:
    session:
      timeout: 30m
      cookie:
        name: EFP30_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
