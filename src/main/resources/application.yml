spring:
  application:
    name: efp30-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/efp30}
    username: ${DATABASE_USERNAME:efp30}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  jackson:
    time-zone: America/Argentina/Buenos_Aires
efp30:
  media:
    root: ${MEDIA_ROOT:./data/media}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
