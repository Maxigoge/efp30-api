openapi: 3.1.0
info:
  title: API de EFP N°30
  version: 1.0.0
  description: |
    Contrato oficial para la web institucional y administración editorial. La
    API es fuente oficial; cada consumidor conserva una copia identificada por
    el SHA del commit que la contiene. Los cambios aditivos conservan
    compatibilidad. Todo cambio incompatible se documenta y coordina con los
    consumidores antes de implementarlo. Campus no forma parte de esta versión.
servers:
  - url: /api/v1
    description: Mismo host del frontend, enrutado por Nginx a la API.
tags:
  - name: Lectura pública
    description: Sin sesión; sólo recursos PUBLISHED y medios públicos habilitados.
  - name: Autenticación
    description: Sesiones administrativas con cookie y CSRF.
  - name: Administración editorial
    description: Requiere ADMIN o EDITOR salvo que se indique ADMIN.
  - name: Administración de usuarios
    description: Requiere ADMIN.
security: []
paths:
  /public/portada/carrusel:
    get:
      tags:
        - Lectura pública
      operationId: getHomepageCarousel
      summary: Fotografías elegidas para portada
      description: Sólo fotos habilitadas y seleccionadas de cursos PUBLISHED y medios PUBLIC habilitados. Orden position,
        courseId, id ASC. Puede devolver items vacío. coverMediaId del curso es independiente de la galería.
      responses:
        "200":
          description: Selección pública.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarouselResponse"
              example:
                items:
                  - id: 55555555-5555-4555-8555-555555555501
                    courseId: 33333333-3333-4333-8333-333333333301
                    courseSlug: electricidad-domiciliaria
                    courseTitle: Electricidad domiciliaria
                    mediaId: 66666666-6666-4666-8666-666666666601
                    imageUrl: /api/v1/public/media/66666666-6666-4666-8666-666666666601
                    alt: Tablero didáctico
                    position: 1
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/noticias:
    get:
      tags:
        - Lectura pública
      operationId: listPublicNews
      summary: Listar noticias publicadas
      description: Orden publishedAt DESC, id ASC. q busca en title y summary; category es exacta; featured filtra destacados.
        Nunca incluye DRAFT o ARCHIVED.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          schema:
            type: string
            maxLength: 60
        - name: featured
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Página pública.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPage"
              example:
                items:
                  - id: 11111111-1111-4111-8111-111111111101
                    slug: inscripciones-a-talleres
                    title: Inscripciones a talleres
                    summary: Oferta de formación profesional.
                    coverUrl: /api/v1/public/media/66666666-6666-4666-8666-666666666602
                    category: Institucional
                    featured: true
                    publishedAt: 2026-10-10T12:00:00-03:00
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/noticias/{slug}:
    get:
      tags:
        - Lectura pública
      operationId: getPublicNews
      summary: Leer noticia publicada por slug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Noticia pública sin estado, versión ni auditoría.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsPublic"
              example:
                id: 11111111-1111-4111-8111-111111111101
                slug: inscripciones-a-talleres
                title: Inscripciones a talleres
                summary: Oferta formativa.
                bodyMarkdown: La inscripción se realiza en la institución.
                coverUrl: null
                category: Institucional
                featured: true
                publishedAt: 2026-10-10T12:00:00-03:00
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/cursos:
    get:
      tags:
        - Lectura pública
      operationId: listPublicCourses
      summary: Listar cursos publicados
      description: Orden title ASC, id ASC. q busca title y summary.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: familyId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Página pública.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePage"
              example:
                items:
                  - id: 33333333-3333-4333-8333-333333333301
                    slug: electricidad-domiciliaria
                    title: Electricidad domiciliaria
                    family:
                      id: 44444444-4444-4444-8444-444444444401
                      slug: energia
                      name: Energía
                    summary: Instalaciones domiciliarias seguras.
                    durationHours: 120
                    modality: PRESENTIAL
                    enrollmentStatus: CONSULTATION
                    coverUrl: null
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/cursos/{slug}:
    get:
      tags:
        - Lectura pública
      operationId: getPublicCourse
      summary: Leer curso publicado por slug
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Curso público; galería sólo con fotos habilitadas y públicas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePublic"
              example:
                id: 33333333-3333-4333-8333-333333333301
                slug: electricidad-domiciliaria
                title: Electricidad domiciliaria
                family:
                  id: 44444444-4444-4444-8444-444444444401
                  slug: energia
                  name: Energía
                summary: Instalaciones domiciliarias seguras.
                bodyMarkdown: Prácticas de circuitos, protecciones y mediciones.
                requirements:
                  - Edad mínima 18 años
                  - DNI
                durationHours: 120
                modality: PRESENTIAL
                enrollmentStatus: CONSULTATION
                coverUrl: null
                photos:
                  - id: 55555555-5555-4555-8555-555555555501
                    imageUrl: /api/v1/public/media/66666666-6666-4666-8666-666666666601
                    alt: Tablero didáctico
                    position: 1
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/familias:
    get:
      tags:
        - Lectura pública
      operationId: listPublicFamilies
      summary: Listar familias activas con cursos publicados
      responses:
        "200":
          description: Familias visibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyList"
              example:
                items:
                  - id: 44444444-4444-4444-8444-444444444401
                    slug: energia
                    name: Energía
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/institucion:
    get:
      tags:
        - Lectura pública
      operationId: getPublicInstitution
      summary: Leer información y contacto
      description: Responde 503 hasta que la información institucional inicial haya sido configurada.
      responses:
        "200":
          description: Datos públicos sin version interna.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionPublic"
              example:
                name: Escuela de Formación Profesional N°30
                description: Formación profesional pública.
                address: Av. Ejemplo 1234
                email: contacto@efp30.example
                phones:
                  - +54 11 4000-0000
                socialLinks:
                  - label: Instagram
                    url: https://example.com/efp30
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/eventos:
    get:
      tags:
        - Lectura pública
      operationId: listPublicEvents
      summary: Listar eventos solapados con intervalo
      description: |
        from/to son obligatorios, ISO 8601 con offset, y forman [from,to).
        Incluye eventos con startsAt < to y endsAt > from. Orden startsAt ASC,
        id ASC. allDay usa medianoche local y fin exclusivo; timezone
        America/Argentina/Buenos_Aires. Un evento del 20/10 finaliza el
        21/10T00:00:00-03:00.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: 2026-10-01T00:00:00-03:00
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: 2026-11-01T00:00:00-03:00
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Página de eventos publicados que se solapan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
              example:
                items:
                  - id: 22222222-2222-4222-8222-222222222201
                    slug: jornada-institucional
                    title: Jornada institucional
                    description: Encuentro abierto.
                    startsAt: 2026-10-20T00:00:00-03:00
                    endsAt: 2026-10-21T00:00:00-03:00
                    timezone: America/Argentina/Buenos_Aires
                    location: Sede
                    allDay: true
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/eventos/{slug}:
    get:
      tags:
        - Lectura pública
      operationId: getPublicEvent
      summary: Leer evento publicado
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Evento público.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPublic"
              example:
                id: 22222222-2222-4222-8222-222222222202
                slug: charla-salud-y-seguridad
                title: Charla de seguridad e higiene
                description: Charla abierta de 18 a 20 h.
                startsAt: 2026-10-22T18:00:00-03:00
                endsAt: 2026-10-22T20:00:00-03:00
                timezone: America/Argentina/Buenos_Aires
                location: Aula taller
                allDay: false
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /public/media/{id}:
    get:
      tags:
        - Lectura pública
      operationId: getPublicMediaContent
      summary: Descargar archivo público habilitado
      description: PRIVATE, deshabilitado e inexistente responden el mismo 404. Sin rutas físicas. PDF como attachment.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Bytes validados, nosniff; imagen inline y PDF attachment.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/csrf:
    get:
      tags:
        - Autenticación
      operationId: getCsrfToken
      summary: Obtener token CSRF
      description: Pedir antes de login y escrituras; renovar tras login y logout.
      responses:
        "200":
          description: Token asociado a la sesión del host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
              example:
                token: token-csrf-ficticio
                headerName: X-CSRF-TOKEN
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      tags:
        - Autenticación
      operationId: login
      summary: Iniciar sesión administrativa
      description: CSRF obligatorio; rate limit por IP/cuenta; mensaje 401 genérico; rota id de sesión. Cookie EFP30_SESSION
        HttpOnly, Secure, SameSite=Lax, host-only en producción.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          description: Sesión iniciada; volver a pedir CSRF antes de escribir.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie host-only EFP30_SESSION.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              example:
                user:
                  id: 77777777-7777-4777-8777-777777777702
                  displayName: Editora de prueba
                  email: editora@efp30.test
                  roles:
                    - EDITOR
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      tags:
        - Autenticación
      operationId: getCurrentSession
      summary: Consultar sesión actual
      security:
        - cookieSession: []
      responses:
        "200":
          description: Usuario autenticado sin datos secretos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
              example:
                user:
                  id: 77777777-7777-4777-8777-777777777701
                  displayName: Administrador de prueba
                  email: admin@efp30.test
                  roles:
                    - ADMIN
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout:
    post:
      tags:
        - Autenticación
      operationId: logout
      summary: Cerrar sesión
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Sesión invalidada; pedir CSRF nuevo para el próximo login.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/password:
    post:
      tags:
        - Autenticación
      operationId: changeOwnPassword
      summary: Cambiar contraseña propia
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        $ref: "#/components/requestBodies/ChangePassword"
      responses:
        "204":
          description: Actualizada; invalida las otras sesiones del usuario.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/noticias:
    get:
      tags:
        - Administración editorial
      operationId: listAdminNews
      summary: Listar noticias en cualquier estado
      description: ADMIN y EDITOR; q busca título/resumen y category compara exacto.
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
        - EDITOR
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/AdminStatus"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          schema:
            type: string
            maxLength: 60
      responses:
        "200":
          description: Página administrativa con elementos tipados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsAdminPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Administración editorial
      operationId: createAdminNews
      summary: Crear noticia DRAFT
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
        - EDITOR
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        $ref: "#/components/requestBodies/NewsCreate"
      responses:
        "201":
          description: DRAFT con version=0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/noticias/{id}:
    get:
      tags:
        - Administración editorial
      operationId: getAdminNews
      summary: Consultar noticia por UUID
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
        - EDITOR
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cualquier estado editorial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsAdmin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Administración editorial
      operationId: updateAdminNews
      summary: Editar noticia sin cambiar slug ni estado
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
        - EDITOR
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        $ref: "#/components/requestBodies/NewsUpdate"
      responses:
        "200":
          description: Actualizada con version incrementada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/noticias/{id}/publish:
    post:
      tags:
        - Administración editorial
      operationId: publishAdminNews
      summary: Publicar noticia
      description: Sólo DRAFT puede publicarse. Valida campos obligatorios; publishedAt lo asigna el servidor.
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
        - EDITOR
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        $ref: "#/components/requestBodies/Version"
      responses:
        "200":
          $ref: "#/components/responses/EditorialAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/noticias/{id}/archive:
    post:
      tags:
        - Administración editorial
      operationId: archiveAdminNews
      summary: Archivar noticia y retirarla de rutas públicas
      description: DRAFT o PUBLISHED pasa a ARCHIVED; ARCHIVED es terminal en v1.
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
        - EDITOR
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        $ref: "#/components/requestBodies/Version"
      responses:
        "200":
          $ref: "#/components/responses/EditorialAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/cursos:
    get:
      tags:
        - Administración editorial
      operationId: listAdminCourses
      summary: Listar cursos en cualquier estado
      description: ADMIN y EDITOR; orden title ASC, id ASC.
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
        - EDITOR
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/AdminStatus"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: familyId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Página administrativa con elementos tipados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseAdminPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Administración editorial
      operationId: createAdminCourse
      summary: Crear curso DRAFT
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
        - EDITOR
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        $ref: "#/components/requestBodies/CourseCreate"
      responses:
        "201":
          description: DRAFT con version=0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/cursos/{id}:
    get:
      tags:
        - Administración editorial
      operationId: getAdminCourse
      summary: Consultar curso por UUID
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
        - EDITOR
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cualquier estado editorial.
          content:
            application/json:
              schema:
