        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        $ref: "#/components/requestBodies/UserUpdate"
      responses:
        "200":
          description: Cuenta actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users/{id}/password:
    post:
      tags:
        - Administración de usuarios
      operationId: resetAdminUserPassword
      summary: Restablecer contraseña sin envío de correo
      security:
        - cookieSession: []
      x-required-roles:
        - ADMIN
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        $ref: "#/components/requestBodies/ResetPassword"
      responses:
        "204":
          description: Contraseña restablecida; sesiones existentes invalidadas.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: EFP30_SESSION
      description: Cookie host-only HttpOnly, Secure en producción, SameSite=Lax.
  parameters:
    Page:
      name: page
      in: query
      description: Página base cero.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Por defecto 20, máximo 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 120
    AdminStatus:
      name: status
      in: query
      description: Si se omite incluye todos los estados.
      schema:
        $ref: "#/components/schemas/EditorialStatus"
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token vigente obtenido de GET /auth/csrf.
      schema:
        type: string
        minLength: 16
  requestBodies:
    NewsCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NewsCreateRequest"
          example:
            slug: muestra-anual
            title: Muestra anual
            summary: Resumen
            bodyMarkdown: Contenido pendiente
            coverMediaId: null
            category: Institucional
            featured: false
    NewsUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NewsUpdateRequest"
          example:
            version: 0
            title: Muestra anual
            summary: Resumen
            bodyMarkdown: Contenido actualizado
            coverMediaId: null
            category: Institucional
            featured: false
    CourseCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CourseCreateRequest"
          example:
            slug: panaderia-artesanal
            title: Panadería artesanal
            familyId: 44444444-4444-4444-8444-444444444402
            summary: Técnicas iniciales
            bodyMarkdown: Masas y horneado
            requirements: []
            durationHours: 80
            modality: PRESENTIAL
            enrollmentStatus: CONSULTATION
            coverMediaId: null
    CourseUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CourseUpdateRequest"
          example:
            version: 0
            title: Panadería artesanal
            familyId: 44444444-4444-4444-8444-444444444402
            summary: Técnicas iniciales
            bodyMarkdown: Masas
            fermentación y horneado: null
            requirements:
              - Delantal
            durationHours: 80
            modality: PRESENTIAL
            enrollmentStatus: CONSULTATION
            coverMediaId: null
    EventCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventCreateRequest"
          example:
            slug: jornada-institucional
            title: Jornada institucional
            description: Encuentro abierto
            startsAt: 2026-10-20T00:00:00-03:00
            endsAt: 2026-10-21T00:00:00-03:00
            timezone: America/Argentina/Buenos_Aires
            location: Sede
            allDay: true
    EventUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventUpdateRequest"
          example:
            version: 0
            title: Jornada institucional
            description: Encuentro abierto
            startsAt: 2026-10-20T00:00:00-03:00
            endsAt: 2026-10-21T00:00:00-03:00
            timezone: America/Argentina/Buenos_Aires
            location: Sede
            allDay: true
    FamilyCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FamilyCreateRequest"
          example:
            slug: industria-grafica
            name: Industria gráfica
    FamilyUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FamilyUpdateRequest"
          example:
            version: 0
            name: Energía y electricidad
            active: true
    InstitutionUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InstitutionUpdateRequest"
          example:
            version: 0
            name: Escuela de Formación Profesional N°30
            description: Formación profesional pública
            address: Av. Ejemplo 1234
            email: contacto@efp30.example
            phones:
              - +54 11 4000-0000
            socialLinks:
              - label: Instagram
                url: https://example.com/efp30
    MediaUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/MediaUploadRequest"
          encoding:
            file:
              contentType: image/jpeg, image/png, image/webp, application/pdf
          example:
            file: tablero.jpg
            visibility: PUBLIC
    MediaUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MediaUpdateRequest"
          example:
            version: 0
            enabled: false
            visibility: PUBLIC
    CoursePhotos:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CoursePhotosUpdateRequest"
          example:
            version: 1
            photos:
              - id: 55555555-5555-4555-8555-555555555501
                mediaId: 66666666-6666-4666-8666-666666666601
                alt: Tablero de prácticas
                position: 1
                enabled: true
                showOnHomepage: true
              - id: null
                mediaId: 66666666-6666-4666-8666-666666666604
                alt: Práctica supervisada
                position: 2
                enabled: true
                showOnHomepage: false
    Version:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionRequest"
          example:
            version: 0
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginRequest"
          example:
            email: editora@efp30.test
            password: contraseña-ficticia
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChangePasswordRequest"
          example:
            currentPassword: contraseña-actual
            newPassword: contraseña-nueva-larga
    UserCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserCreateRequest"
          example:
            displayName: Editora
            email: editora@efp30.test
            password: contraseña-ficticia-larga
            roles:
              - EDITOR
    UserUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserUpdateRequest"
          example:
            version: 0
            displayName: Editora
            roles:
              - EDITOR
            enabled: true
    ResetPassword:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResetPasswordRequest"
          example:
            version: 0
            newPassword: nueva-contraseña-ficticia
  responses:
    EditorialAction:
      description: Recurso editorial actualizado con estado destino y versión nueva.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/NewsAdmin"
              - $ref: "#/components/schemas/CourseAdmin"
              - $ref: "#/components/schemas/EventAdmin"
    BadRequest:
      description: Entrada, filtro, intervalo o validación de campos inválidos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Solicitud inválida
            status: 400
            detail: Revisá los campos indicados.
            instance: /api/v1/admin/eventos
            code: VALIDATION_ERROR
            fieldErrors:
              - field: endsAt
                message: Debe ser posterior a startsAt
    Unauthorized:
      description: Sesión ausente o credenciales inválidas con mensaje genérico.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: La sesión no es válida.
            instance: /api/v1/auth/me
            code: UNAUTHENTICATED
            fieldErrors: []
    Forbidden:
      description: Sin rol suficiente.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Acceso denegado
            status: 403
            detail: No tenés permiso.
            instance: /api/v1/admin/users
            code: FORBIDDEN
            fieldErrors: []
    CsrfForbidden:
      description: Token CSRF ausente, vencido o inválido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Solicitud rechazada
            status: 403
            detail: Volvé a pedir el token CSRF.
            instance: /api/v1/admin/noticias
            code: CSRF_INVALID
            fieldErrors: []
    NotFound:
      description: Inexistente o no visible; no revela borradores ni medios privados.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: No encontrado
            status: 404
            detail: El recurso no existe o no está disponible.
            instance: /api/v1/public/noticias/no-publicada
            code: NOT_FOUND
            fieldErrors: []
    Conflict:
      description: Versión obsoleta, slug duplicado o asociación inválida.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Conflicto
            status: 409
            detail: El recurso cambió; actualizalo antes de guardar.
            instance: /api/v1/admin/noticias/11111111-1111-4111-8111-111111111102
            code: VERSION_CONFLICT
            fieldErrors: []
    PayloadTooLarge:
      description: Imágenes hasta 5 MiB y PDF hasta 10 MiB.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Archivo grande
            status: 413
            detail: Se superó el límite por tipo.
            instance: /api/v1/admin/media
            code: FILE_TOO_LARGE
            fieldErrors: []
    UnsupportedMediaType:
      description: MIME detectado inválido o no permitido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Tipo no permitido
            status: 415
            detail: MIME no admitido.
            instance: /api/v1/admin/media
            code: MEDIA_TYPE_UNSUPPORTED
            fieldErrors: []
    RateLimited:
      description: Exceso de intentos de login.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Demasiados intentos
            status: 429
            detail: Esperá antes de reintentar.
            instance: /api/v1/auth/login
            code: RATE_LIMITED
            fieldErrors: []
    InternalError:
      description: Error genérico, sin stacktrace ni datos internos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Error interno
            status: 500
            detail: No se pudo completar.
            instance: /api/v1/public/noticias
            code: INTERNAL_ERROR
            fieldErrors: []
    ServiceUnavailable:
      description: Información pública institucional todavía no configurada.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Información no disponible
            status: 503
            detail: La información institucional todavía no está configurada.
            instance: /api/v1/public/institucion
            code: INSTITUTION_NOT_CONFIGURED
            fieldErrors: []
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - fieldErrors
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    PageMeta:
      type: object
      required:
        - items
        - page
        - size
        - totalItems
        - totalPages
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    EditorialStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
    AdminRole:
      type: string
      enum:
        - ADMIN
        - EDITOR
    Modality:
      type: string
      enum:
        - PRESENTIAL
        - ONLINE
        - HYBRID
    EnrollmentStatus:
      type: string
      enum:
        - CONSULTATION
        - OPEN
        - CLOSED
    MediaVisibility:
      type: string
      enum:
        - PUBLIC
        - PRIVATE
    VersionRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 0
    NewsFields:
      type: object
      required:
        - title
        - summary
        - bodyMarkdown
        - category
        - featured
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        summary:
          type: string
          minLength: 1
          maxLength: 400
        bodyMarkdown:
          type: string
          minLength: 1
          maxLength: 50000
          description: Markdown sin HTML crudo.
        category:
          type: string
          minLength: 1
          maxLength: 60
        featured:
          type: boolean
        coverMediaId:
          type:
            - string
            - "null"
          format: uuid
    NewsPublic:
      allOf:
        - $ref: "#/components/schemas/NewsFields"
        - type: object
          required:
            - id
            - slug
            - coverUrl
            - publishedAt
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            coverUrl:
              type:
                - string
                - "null"
              format: uri-reference
            publishedAt:
              type: string
              format: date-time
      description: PUBLISHED; excluye status, version y auditoría.
    NewsPublicSummary:
      type: object
      required: [id, slug, title, summary, coverUrl, category, featured, publishedAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        summary: {type: string}
        coverUrl: {type: [string, 'null'], format: uri-reference}
        category: {type: string}
        featured: {type: boolean}
        publishedAt: {type: string, format: date-time}
    NewsAdmin:
      allOf:
        - $ref: "#/components/schemas/NewsFields"
        - type: object
          required:
            - id
            - slug
            - status
            - publishedAt
            - createdAt
            - updatedAt
            - version
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            status:
              $ref: "#/components/schemas/EditorialStatus"
            publishedAt:
              type:
                - string
                - "null"
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            version:
              type: integer
              minimum: 0
    NewsPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NewsPublicSummary"
    NewsAdminPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NewsAdmin"
    NewsCreateRequest:
      allOf:
        - $ref: "#/components/schemas/NewsFields"
        - type: object
          required:
            - slug
          properties:
            slug:
              type: string
              pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              maxLength: 120
    NewsUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/NewsFields"
        - type: object
          required:
            - version
          properties:
            version:
              type: integer
              minimum: 0
    FamilyPublic:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    FamilyAdmin:
      allOf:
        - $ref: "#/components/schemas/FamilyPublic"
        - type: object
          required:
            - active
            - version
          properties:
            active:
              type: boolean
            version:
              type: integer
              minimum: 0
    FamilyList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FamilyPublic"
    FamilyAdminPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/FamilyAdmin"
    FamilyCreateRequest:
      type: object
      additionalProperties: false
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 120
    FamilyUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - version
        - name
        - active
      properties:
        version:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
    FamilyRef:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    CourseFields:
      type: object
      required:
        - title
        - familyId
        - summary
        - bodyMarkdown
        - requirements
        - modality
        - enrollmentStatus
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        familyId:
          type: string
          format: uuid
        summary:
          type: string
          minLength: 1
          maxLength: 400
        bodyMarkdown:
          type: string
          minLength: 1
          maxLength: 50000
          description: Markdown sin HTML crudo.
        requirements:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 240
        durationHours:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 10000
        modality:
          $ref: "#/components/schemas/Modality"
        enrollmentStatus:
          $ref: "#/components/schemas/EnrollmentStatus"
        coverMediaId:
          type:
            - string
            - "null"
          format: uuid
    CourseSummary:
      type: object
      required:
        - id
        - slug
        - title
        - family
        - summary
        - durationHours
        - modality
        - enrollmentStatus
        - coverUrl
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        family:
          $ref: "#/components/schemas/FamilyRef"
        summary:
          type: string
        durationHours:
          type:
            - integer
            - "null"
        modality:
          $ref: "#/components/schemas/Modality"
        enrollmentStatus:
          $ref: "#/components/schemas/EnrollmentStatus"
        coverUrl:
          type:
            - string
            - "null"
          format: uri-reference
    CoursePhotoPublic:
      type: object
      required:
        - id
        - imageUrl
        - alt
        - position
      properties:
        id:
          type: string
          format: uuid
        imageUrl:
          type: string
          format: uri-reference
        alt:
          type: string
        position:
          type: integer
          minimum: 0
    CoursePublic:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          required:
            - bodyMarkdown
            - requirements
            - photos
          properties:
            bodyMarkdown:
              type: string
            requirements:
              type: array
              items:
                type: string
            photos:
              type: array
              items:
                $ref: "#/components/schemas/CoursePhotoPublic"
      description: Sólo PUBLISHED y familias activas; sin comisiones, matrículas ni datos académicos.
    CoursePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CourseSummary"
    CourseAdmin:
      allOf:
        - $ref: "#/components/schemas/CourseFields"
        - type: object
          required:
            - id
            - slug
            - status
            - publishedAt
            - createdAt
            - updatedAt
            - version
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            status:
              $ref: "#/components/schemas/EditorialStatus"
            publishedAt:
              type:
                - string
                - "null"
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            version:
              type: integer
              minimum: 0
    CourseAdminPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CourseAdmin"
    CourseCreateRequest:
      allOf:
        - $ref: "#/components/schemas/CourseFields"
        - type: object
          required:
            - slug
          properties:
            slug:
              type: string
              pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              maxLength: 120
    CourseUpdateRequest:
      allOf:
